<!-- Quick Actions -->
<div th:fragment="quickActions" class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Add Meal Card -->
    <div class="bg-blue-500 text-white rounded-lg p-6 flex flex-col">
        <div class="flex items-center mb-4">
            <i class="fas fa-plus-circle text-xl mr-2"></i>
            <h3 class="text-xl font-semibold">Add Meal</h3>
        </div>
        <p class="text-sm mb-4">Add a new meal to the database</p>
        <button class="mt-auto bg-white text-blue-500 py-2 px-4 rounded-md hover:bg-blue-50 transition-colors">
            Add Meal
        </button>
    </div>

    <!-- View Orders Card -->
    <div class="bg-indigo-500 text-white rounded-lg p-6 flex flex-col">
        <div class="flex items-center mb-4">
            <i class="fas fa-list-ul text-xl mr-2"></i>
            <h3 class="text-xl font-semibold">View Orders</h3>
        </div>
        <p class="text-sm mb-4">See list of meal orders for the week</p>
        <button class="mt-auto bg-white text-indigo-500 py-2 px-4 rounded-md hover:bg-indigo-50 transition-colors">
            View Orders
        </button>
    </div>

    <!-- Weekly Menu Card -->
    <div class="bg-purple-500 text-white rounded-lg p-6 flex flex-col">
        <div class="flex items-center mb-4">
            <i class="fas fa-calendar-week text-xl mr-2"></i>
            <h3 class="text-xl font-semibold">Weekly Menu</h3>
        </div>
        <p class="text-sm mb-4">View complete menu for next days</p>
        <button class="mt-auto bg-white text-purple-500 py-2 px-4 rounded-md hover:bg-purple-50 transition-colors">
            View Menu
        </button>
    </div>
</div>
